listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled         on;
    listen          8080;
    # Keep the default SRS path for its console
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled on;
    listen 8000;
    # IMPORTANT: For Docker/LAN environments, setting this to the Docker service 
    # name ('srs') or a placeholder IP (like 127.0.0.1) often works better 
    # than an external public IP when testing WebRTC locally. 
    # If users outside your network need to publish, you must change this 
    # to your actual public IP or domain name.
    candidate 127.0.0.1;  # Updated for local Docker testing
}

vhost __defaultVhost__ {

    # RTMP/WebRTC ingest + HLS output
    rtmp { enabled on; }
    rtc  { enabled on; }
    # HLS is not strictly needed for the radio flow, but leaving it enabled
    # for testing/debugging.
    hls  {
        enabled      on;
        hls_fragment 3;
        hls_window   30;
        hls_path     ./objs/nginx/html;
    }
    
    # This block is added to configure the specific RTMP stream path 
    # that Liquidsoap is pulling from (rtmp://srs/live/admin)
    # This ensures the stream is published correctly.
    application live {
        live on;
    }

    # 🔐 SECURITY: http_hooks
    # Uncomment and adjust these if you later introduce an authentication 
    # backend service.
#    http_hooks {
#        enabled     on;
#        on_publish  http://backend:3000/api/srs/on-publish;
#        on_unpublish http://backend:3000/api/srs/on-unpublish;
#    }
}