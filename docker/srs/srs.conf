listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate YOUR_PUBLIC_IP;  # change this
}

vhost __defaultVhost__ {

    # RTMP/WebRTC ingest + HLS output
    rtmp { enabled on; }
    rtc  { enabled on; }
    hls  {
        enabled      on;
        hls_fragment 3;
        hls_window   30;
        hls_path     ./objs/nginx/html;
    }

    # 🔐 SECURITY: http_hooks
#    http_hooks {
#        enabled     on;
#
#        # Called when someone tries to publish (RTMP/WebRTC)
#        on_publish  http://backend:3000/api/srs/on-publish;
#
 #      # Called when someone stops publishing (optional, but useful)
 #       on_unpublish http://backend:3000/api/srs/on-unpublish;
 #   }
}
