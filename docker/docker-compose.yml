services:
  # -------------------------------
  # 1. SRS (WebRTC → RTMP)
  # -------------------------------
  srs:
    image: ossrs/srs:5
    container_name: srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
      - "8000:8000/udp"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf


  # -------------------------------
  # 3. Icecast (Distribution)
  # -------------------------------
# -------------------------------
  # 3. Icecast (Distribution)
  # -------------------------------
  icecast:
    image: moul/icecast
    container_name: icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme
      - ICECAST_PASSWORD=hackme
      - ICECAST_RELAY_PASSWORD=hackme
    volumes:
      # Mount our custom config
      - ./icecast:/etc/icecast2

  # 3. Message Queue (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports: 
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password


  # 5. Liquidsoap INGEST (Handles "Dirty" Live Inputs)
  ls-ingest:
    image: savonet/liquidsoap:rolling-release-v2.4.x
    container_name: ls-ingest
    depends_on: [srs, icecast]
    ports:
      - "1235:1235" # 👈 Maps to Ingest Telnet
    environment:
      ICECAST_PASS: hackme
    volumes:
      - ./liquidsoap/config/ingest.liq:/script/ingest.liq:ro
    command: ["liquidsoap", "/script/ingest.liq"]

  # 6. Liquidsoap PLAYOUT (The "Clean" Master Output)
  ls-playout:
    image: savonet/liquidsoap:rolling-release-v2.4.x
    container_name: ls-playout
    depends_on: [icecast]
    ports: ["1234:1234"] # Telnet only on the Master
 
  # 🚨 KEY FIX FOR BARE METAL NODE.JS 🚨
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    environment:
      ICECAST_PASS: hackme
      # Point to the host machine using the mapped hostname
      SIDECAR_URL: "http://host.docker.internal:5000"
    volumes:
      - ./liquidsoap/config/playout.liq:/script/playout.liq:ro
      - ../backend/radio/:/radio/:ro # Mount your music here
    command: ["liquidsoap", "/script/playout.liq"]


