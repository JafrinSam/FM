

services:
  web:
    image: ghcr.io/azuracast/azuracast:stable
    container_name: azuracast_web
    restart: unless-stopped
    env_file: .env
    environment:
      AZURACAST_DC_REVISION: 1
    volumes:
      # --- CRITICAL DATA (Must Persist) ---
      - azuracast_db_data:/var/lib/mysql          # Database (Settings/Users)
      - ./station_data:/var/azuracast/stations # Music/Media Files
      
      # --- OPTIONAL / SUPPORT DATA ---
      - ./azuracast/backups:/var/azuracast/backups
      - ./azuracast/storage:/var/azuracast/storage  # Uploads/Album Art
      
    ports:
      - "80:80"
      - "443:443"
      - "2022:2022"
      - "8000-8010:8000-8010" # Reduced range for faster startup

  # -------------------------------
  # STRAPI (Separate Service)
  # -------------------------------
  strapiDB:
    container_name: strapiDB
    image: postgres:16.0-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"  
    volumes:
      - strapi-data:/var/lib/postgresql/data/
    networks:
      - strapi
  
  minio:
    image: minio/minio
    container_name: minio_server
    ports:
      - "9000:9000"  # API Port
      - "9001:9001"  # Console Port
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password123"
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

networks:
  strapi:
    driver: bridge
  default: 
    driver: bridge

volumes:
  azuracast_db_data:
  azuracast_station_data:
  azuracast_storage:
  strapi-data: