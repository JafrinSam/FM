services:
  # -------------------------------
  # 1. AZURACAST (All-In-One)
  # -------------------------------
  web:
    image: ghcr.io/azuracast/azuracast:stable
    container_name: azuracast_web
    restart: unless-stopped
    env_file: .env
    environment:
      AZURACAST_DC_REVISION: 1
    volumes:
      # Data Mappings
      - ./station_data:/var/azuracast/stations
      - azuracast_db_data:/var/lib/mysql
      - ./azuracast/backups:/var/azuracast/backups
      
    ports:
      - "80:80"
      - "443:443"
      - "2022:2022"
      - "8000-8050:8000-8050" 



